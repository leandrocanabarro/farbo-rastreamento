global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: tracker-platform
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:8080']
        labels:
          service: tracker-platform

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
